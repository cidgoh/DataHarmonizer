        text: Environmental system process
        title: Environmental system process
        meaning: ENVO:02500000
      Algal bloom [ENVO:02500018]:
        text: Algal bloom [ENVO:02500018]
        title: Algal bloom [ENVO:02500018]
        meaning: ENVO:02500018
        description: A process during which the populations in a community of algae in a marine or freshwater ecosystem undergo rapid growth, resulting in high concentrations of algal cells that occur only periodically and briefly in that ecosystem, relative to their concentrations through the majority of the planetary orbital period.
