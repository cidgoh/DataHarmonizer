        meaning: ENVO:00003064
        description: Drinking water is water which may be consumed by humans with no adverse effects on their health.
      Leachate [ENVO:00002141]:
        text: Leachate [ENVO:00002141]
        title: Leachate [ENVO:00002141]
        meaning: ENVO:00002141
        description: The liquid produced when water percolates through any permeable material. It can contain either dissolved or suspended material, or usually both.
      Runoff [ENVO:06105211]:
        text: Runoff [ENVO:06105211]
        title: Runoff [ENVO:06105211]
        meaning: ENVO:06105211
        description: Liquid water which 1) flows over land and 2) is not absorbed or retained by the materials if flows over or through.
      Surface water [ENVO:00002042]:
        text: Surface water [ENVO:00002042]
        title: Surface water [ENVO:00002042]
        meaning: ENVO:00002042
        description: Water that is found on the surface of an astronomical object.
      Storm water [ENVO:01001267]:
        text: Storm water [ENVO:01001267]
        title: Storm water [ENVO:01001267]
        meaning: ENVO:01001267
        description: Water which accumulates on a solid surface during precipitation events and snow/ice melt.
      Sludge [ENVO:00002044]:
        text: Sludge [ENVO:00002044]
        title: Sludge [ENVO:00002044]
        meaning: ENVO:00002044
        description: The residual semi-solid material left from domestic or industrial processes, or wastewater treatment processes.
      Primary sludge [ENVO:00002057]:
        text: Primary sludge [ENVO:00002057]
        title: Primary sludge [ENVO:00002057]
        meaning: ENVO:00002057
        description: Sludge generated from the initial processes (i.e., precipitation, sedimentation) of wastewater treatment.
        is_a: Sludge [ENVO:00002044]
      Secondary sludge [ENVO:00002058]:
        text: Secondary sludge [ENVO:00002058]
        title: Secondary sludge [ENVO:00002058]
        meaning: ENVO:00002058
        description: Activated waste biomass generated during wastewater treatment.
        is_a: Sludge [ENVO:00002044]
      Wastewater [ENVO:00002001]:
        text: Wastewater [ENVO:00002001]
        title: Wastewater [ENVO:00002001]
        meaning: ENVO:00002001
        description: Water that has been adversely affected in quality by anthropogenic influence
      Wastewater sediment [ENVO:03501456]:
        text: Wastewater sediment [ENVO:03501456]
        title: Wastewater sediment [ENVO:03501456]
        meaning: ENVO:03501456
        description: A sediment which is removed from waste water during a waste water treatment process.
      Wastewater effluent [ENVO:03501457]:
        text: Wastewater effluent [ENVO:03501457]
        title: Wastewater effluent [ENVO:03501457]
        meaning: ENVO:03501457
        description: A wastewater which has been discharged from any item of equipment at a stage of a wastewater treatment process.
      Primary wastewater effluent [GENEPIO:0100892]:
        text: Primary wastewater effluent [GENEPIO:0100892]
        title: Primary wastewater effluent [GENEPIO:0100892]
        meaning: GENEPIO:0100892
        description: A wastewater effluent which has been discharged from a primary clarifier after the first stage of sedimentation.
        is_a: Wastewater effluent [ENVO:03501457]
      Secondary wastewater effluent [GENEPIO:0100893]:
        text: Secondary wastewater effluent [GENEPIO:0100893]
        title: Secondary wastewater effluent [GENEPIO:0100893]
        meaning: GENEPIO:0100893
        description: A wastewater effluent which has been discharged from a secondary clarifier after the second stage of sedimentation.
        is_a: Wastewater effluent [ENVO:03501457]
