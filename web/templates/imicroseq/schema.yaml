        description: A fixture which is used primarily for the collection and, in some cases, disposal of human urine and feces.
      Toilet bowl [ENVO:03501218]:
        text: Toilet bowl [ENVO:03501218]
        title: Toilet bowl [ENVO:03501218]
        meaning: ENVO:03501218
        description: A plumbing fixture which is bowl-shaped, part of a toilet fixture, and capable of contain human waste until it is disposed of.
        is_a: Toilet [ENVO:01000516]
      Transport hub [ENVO:03501117]:
        text: Transport hub [ENVO:03501117]
        title: Transport hub [ENVO:03501117]
        meaning: ENVO:03501117
        description: A place where passengers and cargo are exchanged between vehicles or/and between transport modes.
      Airport [ENVO:03501122]:
        text: Airport [ENVO:03501122]
        title: Airport [ENVO:03501122]
        meaning: ENVO:03501122
        description: A human construction with extended facilities from which aircraft flight operations take place.
        is_a: Transport hub [ENVO:03501117]
      Transportation vehicle [ENVO:01000604]:
        text: Transportation vehicle [ENVO:01000604]
        title: Transportation vehicle [ENVO:01000604]
        meaning: ENVO:01000604
        description: A vehicle is a mobile machine which transports people or cargo.
      Boat [ENVO:01000608]:
        text: Boat [ENVO:01000608]
        title: Boat [ENVO:01000608]
        meaning: ENVO:01000608
        description: A boat is a watercraft of any size which is able to float or plane on water.
        is_a: Transportation vehicle [ENVO:01000604]
      Airplane [ENVO:03501349]:
        text: Airplane [ENVO:03501349]
        title: Airplane [ENVO:03501349]
        meaning: ENVO:03501349
        description: An aircraft which 1) has fixed wings and 2) is propelled by a thrust from a jet engine, propeller, or rocket engine.
        is_a: Transportation vehicle [ENVO:01000604]
      Water tank [ENVO:03501254]:
        text: Water tank [ENVO:03501254]
        title: Water tank [ENVO:03501254]
        meaning: ENVO:03501254
      Waste stabilization pond (lagoon) [ENVO:03600076]:
        text: Waste stabilization pond (lagoon) [ENVO:03600076]
        title: Waste stabilization pond (lagoon) [ENVO:03600076]
        meaning: ENVO:03600076
        description: A human construction which confines wastewater in a depression enclosed by earthen structures.
      Wastewater treatment plant [ENVO:00002272]:
        text: Wastewater treatment plant [ENVO:00002272]
        title: Wastewater treatment plant [ENVO:00002272]
        meaning: ENVO:00002272
        description: A plant in which wastewater is treated.
      Influent pump station [ENVO:03501465]:
        text: Influent pump station [ENVO:03501465]
        title: Influent pump station [ENVO:03501465]
        meaning: ENVO:03501465
        description: A facility within a wastewater treatment plant designed to receive and lift incoming wastewater (influent) to a higher elevation for subsequent treatment processes. The influent pump station typically houses pumps, controls, and associated equipment necessary to move wastewater through the treatment process.
        is_a: Wastewater treatment plant [ENVO:00002272]
      Grit chamber [ENVO:03501467]:
        text: Grit chamber [ENVO:03501467]
        title: Grit chamber [ENVO:03501467]
        meaning: ENVO:03501467
        description: A physical structure or equipment within a wastewater treatment plant where grit and other heavy inorganic particles are removed from the influent through sedimentation. The grit chamber helps protect downstream equipment from abrasion and reduces the accumulation of grit in subsequent treatment processes.
        is_a: Wastewater treatment plant [ENVO:00002272]
      Communitor [ENVO:03501472]:
        text: Communitor [ENVO:03501472]
        title: Communitor [ENVO:03501472]
        meaning: ENVO:03501472
        description: A mechanical device designed to reduce the size of solid materials in wastewater. It uses rotating drums or cutting blades to shred large debris into smaller pieces, protecting downstream equipment and enhancing the efficiency of subsequent treatment processes.
        is_a: Wastewater treatment plant [ENVO:00002272]
      Primary clarifer [ENVO:03501468]:
        text: Primary clarifer [ENVO:03501468]
        title: Primary clarifer [ENVO:03501468]
        meaning: ENVO:03501468
        description: A large, sedimentation tank in a wastewater treatment plant where the primary stage of solids separation occurs. In the primary clarifier, suspended solids settle to the bottom as sludge, while lighter materials, such as oils and greases, rise to the surface for removal.
        is_a: Wastewater treatment plant [ENVO:00002272]
      Aeration tank [ENVO:03501469]:
        text: Aeration tank [ENVO:03501469]
        title: Aeration tank [ENVO:03501469]
        meaning: ENVO:03501469
        description: A tank or basin in a wastewater treatment plant where oxygen is introduced into the wastewater to promote the growth of aerobic microorganisms. These microorganisms break down organic pollutants in the water, facilitating the biological treatment process. The aeration tank is essential for reducing the organic load before the water moves to subsequent treatment stages.
        is_a: Wastewater treatment plant [ENVO:00002272]
      Secondary clarifer [ENVO:03501471]:
        text: Secondary clarifer [ENVO:03501471]
        title: Secondary clarifer [ENVO:03501471]
        meaning: ENVO:03501471
        description: A sedimentation tank in a wastewater treatment plant used in the secondary treatment process. The secondary clarifier allows for the settling and removal of biological floc or sludge produced in the aeration tank, further clarifying the treated wastewater before discharge or further treatment.
        is_a: Wastewater treatment plant [ENVO:00002272]
      Sludge dryer [ENVO:03501473]:
        text: Sludge dryer [ENVO:03501473]
        title: Sludge dryer [ENVO:03501473]
        meaning: ENVO:03501473
        description: A device designed to remove moisture from sludge through thermal drying methods, resulting in a dry, granular material that is easier to handle, store, or utilize in other applications.
        is_a: Wastewater treatment plant [ENVO:00002272]
      Wastewater waste tank [GENEPIO:0102057]:
        text: Wastewater waste tank [GENEPIO:0102057]
        title: Wastewater waste tank [GENEPIO:0102057]
        meaning: GENEPIO:0102057
        description: A storage tank designed to hold wastewater, without necessarily processing or treating it. This tank is typically used in systems where temporary containment of excretory waste is required before disposal or treatment.
      Drinking water treatment plant [ENVO:03600004]:
        text: Drinking water treatment plant [ENVO:03600004]
        title: Drinking water treatment plant [ENVO:03600004]
        meaning: ENVO:03600004
