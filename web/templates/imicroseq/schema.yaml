        slot_group: Pathogen diagnostic testing
      diagnostic_measurement_value_3:
        name: diagnostic_measurement_value_3
        rank: 159
        slot_group: Pathogen diagnostic testing
      diagnostic_measurement_unit_3:
        name: diagnostic_measurement_unit_3
        rank: 160
        slot_group: Pathogen diagnostic testing
      diagnostic_measurement_method_3:
        name: diagnostic_measurement_method_3
        rank: 161
        slot_group: Pathogen diagnostic testing
      authors:
        name: authors
        rank: 162
        slot_group: Contributor acknowledgement
slots:
  specimen_collector_sample_id:
    name: specimen_collector_sample_id
    slot_uri: GENEPIO:0001123
    title: specimen collector sample ID
    any_of:
      - range: WhitespaceMinimizedString
      - range: NullValueMenu
    required: true
    description: The user-defined name for the sample.
    identifier: true
    exact_mappings:
      - GISAID:Sample%20ID%20given%20by%20the%20sample%20provider
      - NCBI_BIOSAMPLE_SARS_COV_2_WWS:sample_name
      - NCBI_BIOSAMPLE:sample_name
      - NCBI_SRA:sample_name
      - ENA_GSC_MIxS_WW_ERC00023:source%20material%20identifiers
      - iMicroSeq_Portal:specimen%20collector%20sample%20ID
      - NCBI_BIOSAMPLE_PHA4GE_WWS:sample_name
      - NCBI_BIOSAMPLE_Pathogen:sample_name
    comments:
      - Store the collector sample ID. If this number is considered identifiable information, provide an alternative ID. Be sure to store the key that maps between the original and alternative IDs for traceability and follow up if necessary. Every collector sample ID from a single submitter must be unique. It can have any format, but we suggest that you make it concise, unique and consistent within your lab.
    examples:
      - value: ASDFG123
  sampling_site_id:
    name: sampling_site_id
    slot_uri: GENEPIO:0100760
    title: sampling site ID
    any_of:
      - range: WhitespaceMinimizedString
      - range: NullValueMenu
    recommended: true
    description: The user-defined identifier assigned to a specific location from which samples are taken.
    exact_mappings:
      - NCBI_BIOSAMPLE:collection_site_id
      - ENA_SEWAGE_ERC00036:name%20of%20the%20sampling%20site
      - NCBI_BIOSAMPLE_PHA4GE_WWS:sampling_site_id
    comments:
      - Store the ID for the site from which a sample was taken. The "site" is user defined (e.g. it may be a building and its environs, a specific entity within an environment). Please use the same site ID for all samples from a given site, regardless of when these samples were taken. Any important changes in site location, should be represented with a new site ID.
    examples:
      - value: Site 12A
  sampling_event_id:
    name: sampling_event_id
    slot_uri: GENEPIO:0100761
    title: sampling event ID
    any_of:
      - range: WhitespaceMinimizedString
      - range: NullValueMenu
    recommended: true
    description: The user-defined identifier assigned to a specific event during which one or more samples are taken, from one or more sites.
    exact_mappings:
      - NCBI_BIOSAMPLE_PHA4GE_WWS:sampling_event_id
    comments:
      - Store the ID for the event during which a sample or samples were taken. For example, an event could be one person taking samples from multiple sites, or multiple people taking samples from one site.
    examples:
      - value: Event 120522.1
  insdc_project_accession:
    name: insdc_project_accession
    slot_uri: GENEPIO:0001136
    title: INSDC Project accession
    any_of:
      - range: WhitespaceMinimizedString
      - range: NullValueMenu
    description: The INSDC (i.e., ENA, NCBI, or DDBJ) accession number of the Project(s) to which the Sample belongs.
    structured_pattern:
      syntax: '{UPPER_CASE}'
      partial_match: false
      interpolated: true
    exact_mappings:
      - NCBI_BIOSAMPLE_SARS_COV_2_WWS:bioproject_accession
      - NCBI_BIOSAMPLE:bioproject_accession
      - NCBI_BIOSAMPLE_PHA4GE_WWS:bioproject_accession
      - NCBI_BIOSAMPLE_Pathogen:bioproject_accession
    comments:
      - Store the BioProject accession number. BioProjects are an organizing tool that links together raw sequence data, assemblies, and their associated metadata. Each province will be assigned a different bioproject accession number by the National Microbiology Lab. A valid NCBI BioProject accession has prefix PRJN e.g., PRJNA12345, and is created once at the beginning of a new sequencing project.
    examples:
      - value: PRJNA608651
  insdc_sample_accession:
    name: insdc_sample_accession
    slot_uri: GENEPIO:0001139
    title: INSDC Sample accession
    any_of:
      - range: WhitespaceMinimizedString
      - range: NullValueMenu
    recommended: true
    description: The identifier assigned to a Sample in INSDC (i.e., ENA, NCBI, or DDBJ) archives.
    structured_pattern:
      syntax: '{UPPER_CASE}'
      partial_match: false
      interpolated: true
    comments:
      - Store the accession returned from the Sample submission. NCBI BioSamples will have the prefix SAMN, ENA have the prefix SAMEA, DDBJ have SAMD
    examples:
      - value: SAMN14180202, SAMEA00000002, SAMD00000001
  insdc_sequence_read_accession:
    name: insdc_sequence_read_accession
    slot_uri: GENEPIO:0101203
    title: INSDC sequence read accession
    any_of:
      - range: WhitespaceMinimizedString
      - range: NullValueMenu
    description: The identifier assigned to a sequence in one of the International Nucleotide Sequence Database Collaboration (INSDC) repositories.
    structured_pattern:
      syntax: '{UPPER_CASE}'
      partial_match: false
      interpolated: true
    comments:
      - Store the accession assigned to the submitted sequence. European Nucleotide Archive (ENA) sequence accessions start with ERR, NCBI-SRA accessions start with SRR, DNA Data Bank of Japan (DDBJ) accessions start with DRR and Genome Sequence Archive (GSA) accessions start with CRR.
    examples:
      - value: ERR123456, DRR123456, CRR123456
  sample_collection_project_name:
    name: sample_collection_project_name
    slot_uri: GENEPIO:0100429
    title: sample collection project name
    any_of:
      - range: WhitespaceMinimizedString
      - range: NullValueMenu
    description: The name of the project/initiative/program for which the sample was collected.
    exact_mappings:
      - NCBI_BIOSAMPLE_SARS_COV_2_WWS:project_name
    comments:
      - Provide the name of the project and/or the project ID here. If the information is unknown or cannot be provided, leave blank or provide a null value.
    examples:
      - value: Watershed Project (HA-120)
  data_steward_contact_name:
    name: data_steward_contact_name
    slot_uri: GENEPIO:0102221
    title: data steward contact name
    any_of:
      - range: WhitespaceMinimizedString
      - range: NullValueMenu
    required: true
    description: The name of the individual responsible for the data governance, (meta)data usage and distribution of the data.
    comments:
      - Provide the name of the data steward.
    examples:
      - value: Joe Bloggs
  data_steward_contact_email:
    name: data_steward_contact_email
    slot_uri: GENEPIO:0102222
    title: data steward contact email
    any_of:
      - range: WhitespaceMinimizedString
      - range: NullValueMenu
    required: true
    description: The email address of the individual responsible for the data governance, (meta)data usage and distribution of the data.
    comments:
      - The email address can represent a specific individual or lab e.g. johnnyblogs@lab.ca, or RespLab@lab.ca
    examples:
      - value: WaterTester@facility.ca
  organism:
    name: organism
    slot_uri: GENEPIO:0001191
    title: organism
    any_of:
      - range: WhitespaceMinimizedString
      - range: NullValueMenu
    required: true
    description: Taxonomic name of the organism.
    multivalued: true
    exact_mappings:
      - ENA_SEWAGE_ERC00036:surveillance%20target
      - iMicroSeq_Portal:organism
      - NCBI_BIOSAMPLE_PHA4GE_WWS:organism
      - NCBI_BIOSAMPLE_Pathogen:organism
    comments:
      - 'Provide the official nomenclature for the organism(s) present in the sample. Multiple organisms can be entered, separated by semicolons. Avoid abbreviations. Search for taxonomic names here: ncbi.nlm.nih.gov/taxonomy.'
    examples:
      - value: Severe acute respiratory syndrome coronavirus 2
  taxonomic_identification_process:
    name: taxonomic_identification_process
    slot_uri: GENEPIO:0100583
    title: taxonomic identification process
    any_of:
      - range: TaxonomicIdentificationProcessMenu
      - range: NullValueMenu
    description: The type of planned process by which an organismal entity is associated with a taxon or taxa.
    comments:
      - Provide the type of method used to determine the taxonomic identity of the organism by selecting a value from the pick list. If the information is unknown or cannot be provided, leave blank or provide a null value.
    examples:
      - value: PCR assay [OBI:0002740]
  purpose_of_sampling:
    name: purpose_of_sampling
    slot_uri: GENEPIO:0001198
    title: purpose of sampling
    any_of:
      - range: PurposeOfSamplingMenu
      - range: NullValueMenu
    required: true
    description: The reason that the sample was collected.
    multivalued: true
    exact_mappings:
      - NCBI_BIOSAMPLE_SARS_COV_2_WWS:purpose_of_ww_sampling
      - NCBI_BIOSAMPLE_SARS_COV_2_WWS:description
      - NCBI_BIOSAMPLE:purpose_of_ww_sampling
      - iMicroSeq_Portal:purpose%20of%20sampling
      - NCBI_BIOSAMPLE_PHA4GE_WWS:purpose_of_sampling
    comments:
      - The reason a sample was collected may provide information about potential biases in sampling strategy. Provide the purpose of sampling from the picklist in the template. Most likely, the sample was collected for Public health surveillance. The reason why a sample was originally collected may differ from the reason why it was selected for sequencing, which should be indicated in the "purpose of sequencing" field.
    examples:
      - value: Baseline surveillance (random sampling) [GENEPIO:0100005]
  sample_collected_by_organisation_name:
    name: sample_collected_by_organisation_name
    slot_uri: GENEPIO:0001153
    title: sample collected by organisation name
    any_of:
      - range: WhitespaceMinimizedString
      - range: NullValueMenu
    required: true
    description: The name of the organization with which the sample collector is affiliated.
    exact_mappings:
      - GISAID:Originating%20lab
      - NCBI_BIOSAMPLE_SARS_COV_2_WWS:collected_by
      - NCBI_BIOSAMPLE:collected_by
      - iMicroSeq_Portal:sample%20collected%20by
      - NCBI_BIOSAMPLE_PHA4GE_WWS:collected_by
      - NCBI_BIOSAMPLE_Pathogen:collected_by
    comments:
      - The name of the agency should be written out in full, (with minor exceptions) and be consistent across multiple submissions.
    examples:
      - value: Public Health Agency of Canada
  sample_collected_by_contact_email:
    name: sample_collected_by_contact_email
    slot_uri: GENEPIO:0001156
    title: sample collected by contact email
    any_of:
      - range: WhitespaceMinimizedString
      - range: NullValueMenu
    description: The email address of the contact responsible for follow-up regarding the sample.
    pattern: ^\S+@\S+\.\S+$
    comments:
      - The email address can represent a specific individual or lab e.g. johnnyblogs@lab.ca, or RespLab@lab.ca
    examples:
      - value: WaterTester@facility.ca
  sample_collection_data_steward_name:
    name: sample_collection_data_steward_name
    slot_uri: GENEPIO:0100762
    title: sample collection data steward name
    any_of:
      - range: WhitespaceMinimizedString
      - range: NullValueMenu
    description: The name of the individual responsible for the data governance, (meta)data usage and distribution of the sample.
    comments:
      - Provide the name of the sample collection data steward.
    examples:
      - value: Joe Bloggs
  sample_collection_start_date:
    name: sample_collection_start_date
    slot_uri: GENEPIO:0001174
    title: sample collection start date
    range: date
    required: true
    description: The date on which the sample was collected, or sampling began for a continuous sample.
    todos:
      - <={today}
    exact_mappings:
      - GISAID:Collection%20date
      - NCBI_BIOSAMPLE_SARS_COV_2_WWS:collection_date
      - NCBI_BIOSAMPLE:collection_date
      - ENA_GSC_MIxS_WW_ERC00023:collection%20date
      - ENA_SEWAGE_ERC00036:collection%20date
      - iMicroSeq_Portal:sample%20collection%20date
      - NCBI_BIOSAMPLE_PHA4GE_WWS:collection_date
      - NCBI_BIOSAMPLE_Pathogen:collection_date
    comments:
      - Sample collection date is critical for surveillance and many types of analyses. For samples taken at a single point in time, use this field to capture the date the sample was collected. If your sample was collected continuously over an interval, use this field to capture the sample collection start date. Required granularity includes year, month and day. The date should be provided in ISO 8601 standard format "YYYY-MM-DD".
    examples:
      - value: '2020-03-16'
  sample_collection_start_date_null_reason:
    name: sample_collection_start_date_null_reason
    title: sample collection start date null reason
    range: NullValueMenu
    required: true
  sample_collection_end_date:
    name: sample_collection_end_date
    slot_uri: GENEPIO:0101071
    title: sample collection end date
    range: date
    recommended: true
    description: The date on which sample collection ended for a continuous sample.
    todos:
      - '>={sample_collection_start_date}'
      - <={today}
    comments:
      - Provide the date that sample collection ended in ISO 8601 format i.e. YYYY-MM-DD.
    examples:
      - value: '2020-03-18'
  sample_collection_end_date_null_reason:
    name: sample_collection_end_date_null_reason
    title: sample collection end date null reason
    range: NullValueMenu
    recommended: true
  sample_collection_time_duration_value:
    name: sample_collection_time_duration_value
    slot_uri: GENEPIO:0100766
    title: sample collection time duration value
    range: integer
    recommended: true
    description: The amount of time over which the sample was collected.
    exact_mappings:
      - NCBI_BIOSAMPLE_SARS_COV_2_WWS:ww_sample_duration
      - NCBI_BIOSAMPLE:ww_sample_duration
      - NCBI_BIOSAMPLE_PHA4GE_WWS:sample_collection_time_duration
    comments:
      - Provide the numerical value of time.
    examples:
      - value: '4'
  sample_collection_time_duration_null_reason:
    name: sample_collection_time_duration_null_reason
    title: sample collection time duration value null reason
    any_of:
      - range: string
      - range: NullValueMenu
    description: To be populated if sample collection time duration value or unit is not provided. If populated "sample collection time duration null reason" or "unit" should be empty
  sample_collection_time_duration_unit:
    name: sample_collection_time_duration_unit
    slot_uri: GENEPIO:0100767
    title: sample collection time duration unit
    any_of:
      - range: SampleCollectionDurationUnitMenu
      - range: NullValueMenu
    recommended: true
    description: The units of the time duration measurement of sample collection.
    exact_mappings:
      - NCBI_BIOSAMPLE_SARS_COV_2_WWS:ww_sample_duration
      - NCBI_BIOSAMPLE:ww_sample_duration
      - NCBI_BIOSAMPLE_PHA4GE_WWS:sample_collection_time_duration
    comments:
      - Provide the units from the pick list.
    examples:
      - value: Hour
  geo_loc_name_country:
    name: geo_loc_name_country
    slot_uri: GENEPIO:0001181
    title: geo loc name (country)
    any_of:
      - range: GeoLocNameCountryMenu
      - range: NullValueMenu
    required: true
    description: The country of origin of the sample.
    exact_mappings:
      - GISAID:Location
      - NCBI_BIOSAMPLE_SARS_COV_2_WWS:geo_loc_name
      - NCBI_BIOSAMPLE:geo_loc_name
      - ENA_GSC_MIxS_WW_ERC00023:geographic%20location%20%28country%20and/or%20sea%29
      - ENA_SEWAGE_ERC00036:geographic%20location%20%28country%20and/or%20sea%29
      - iMicroSeq_Portal:geo_loc_name%20%28country%29
      - NCBI_BIOSAMPLE_PHA4GE_WWS:geo_loc_name
      - NCBI_BIOSAMPLE_Pathogen:geo_loc_name
    comments:
      - If known, select a value from the pick list.
    examples:
      - value: Canada
  geo_loc_name_state_province_territory:
    name: geo_loc_name_state_province_territory
    slot_uri: GENEPIO:0001185
    title: geo loc name (state/province/territory)
    any_of:
      - range: GeoLocNameStateProvinceTerritoryMenu
      - range: NullValueMenu
    required: true
    description: The state/province/territory of origin of the sample.
    exact_mappings:
      - NCBI_BIOSAMPLE_SARS_COV_2_WWS:geo_loc_name
      - NCBI_BIOSAMPLE:geo_loc_name
      - ENA_GSC_MIxS_WW_ERC00023:geographic%20location%20%28region%20and%20locality%29
      - ENA_SEWAGE_ERC00036:geographic%20location%20%28region%20and%20locality%29
      - iMicroSeq_Portal:geo_loc_name%20%28state/province/territory%29
      - NCBI_BIOSAMPLE_PHA4GE_WWS:geo_loc_name
      - NCBI_BIOSAMPLE_Pathogen:geo_loc_name
    comments:
      - 'Provide the state/province/territory name from the GAZ geography ontology. Search for geography terms here: https://www.ebi.ac.uk/ols/ontologies/ga'
    examples:
      - value: Ontario
  geo_loc_name_site:
    name: geo_loc_name_site
    slot_uri: GENEPIO:0100436
    title: geo loc name (site)
    any_of:
      - range: WhitespaceMinimizedString
      - range: NullValueMenu
    description: The name of a specific geographical location e.g. Credit River (rather than river).
    exact_mappings:
      - ENA_GSC_MIxS_WW_ERC00023:name%20of%20the%20sampling%20site
      - ENA_SEWAGE_ERC00036:name%20of%20the%20sampling%20site
    comments:
      - Provide the name of the specific geographical site using a specific noun (a word that names a certain place, thing).
    examples:
      - value: Credit River
  geo_loc_name_city:
    name: geo_loc_name_city
    slot_uri: GENEPIO:0001189
    title: geo loc name (city)
    any_of:
      - range: WhitespaceMinimizedString
      - range: NullValueMenu
    description: The city of origin of the sample.
    exact_mappings:
      - NCBI_BIOSAMPLE_SARS_COV_2_WWS:geo_loc_name
      - NCBI_BIOSAMPLE:geo_loc_name
      - NCBI_BIOSAMPLE_PHA4GE_WWS:geo_loc_name
      - NCBI_BIOSAMPLE_Pathogen:geo_loc_name
    comments:
      - 'Provide the city name from the GAZ geography ontology. Search for geography terms here: https://www.ebi.ac.uk/ols/ontologies/gaz'
    examples:
      - value: Vancouver
  geo_loc_latitude:
    name: geo_loc_latitude
    slot_uri: GENEPIO:0100309
    title: geo loc latitude
    any_of:
      - range: WhitespaceMinimizedString
      - range: NullValueMenu
    description: The latitude coordinates of the geographical location of sample collection.
    exact_mappings:
      - ENA_GSC_MIxS_WW_ERC00023:geographic%20location%20%28latitude%29
      - ENA_SEWAGE_ERC00036:geographic%20location%20%28latitude%29
    comments:
      - Provide latitude coordinates if available. Do not use the centre of the city/region/province/state/country or the location of your agency as a proxy, as this implicates a real location and is misleading. Specify as degrees latitude in format "d[d.dddd] N|S".
    examples:
      - value: 38.98 N
  geo_loc_longitude:
    name: geo_loc_longitude
    slot_uri: GENEPIO:0100310
    title: geo loc longitude
    any_of:
      - range: WhitespaceMinimizedString
      - range: NullValueMenu
    description: The longitude coordinates of the geographical location of sample collection.
    exact_mappings:
      - ENA_GSC_MIxS_WW_ERC00023:geographic%20location%20%28longitude%29
      - ENA_SEWAGE_ERC00036:geographic%20location%20%28longitude%29
    comments:
      - Provide longitude coordinates if available. Do not use the centre of the city/region/province/state/country or the location of your agency as a proxy, as this implicates a real location and is misleading. Specify as degrees longitude in format "d[dd.dddd] W|E".
    examples:
      - value: 77.11 W
  environmental_site:
    name: environmental_site
    slot_uri: GENEPIO:0001232
    title: environmental site
    any_of:
      - range: EnvironmentalSiteMenu
      - range: NullValueMenu
    recommended: true
    description: An environmental location may describe a site in the natural or built environment e.g. hospital, wet market, lake.
    multivalued: true
    exact_mappings:
      - GISAID:Specimen%20source
      - NCBI_BIOSAMPLE_SARS_COV_2_WWS:isolation_source
      - NCBI_BIOSAMPLE_SARS_COV_2_WWS:ww_sample_site
      - NCBI_BIOSAMPLE_SARS_COV_2_WWS:description
      - NCBI_BIOSAMPLE:isolation_source
      - NCBI_BIOSAMPLE:ww_sample_site
      - NCBI_BIOSAMPLE:description
      - ENA_GSC_MIxS_WW_ERC00023:local%20environmental%20context
      - iMicroSeq_Portal:environmental%20site
      - NCBI_BIOSAMPLE_Pathogen:isolation_source
    comments:
      - Provide a descriptor of the environmental site sampled. Use the picklist provided in the template. If not applicable, choose a null value.
    examples:
      - value: Influent pump station [ENVO:03501465]
  proximal_environmental_site:
    name: proximal_environmental_site
    slot_uri: GENEPIO:0101205
    title: proximal environmental site
    any_of:
      - range: EnvironmentalSiteMenu
      - range: NullValueMenu
    description: An environmental location in the natural or built environment, that is proximal to a sampling location and which can impact a sample.
    multivalued: true
    exact_mappings:
      - NCBI_BIOSAMPLE_PHA4GE_WWS:adjacent_environment
    comments:
      - Provide a descriptor of the environmental site close to the sampling site. Use the picklist provided in the template. If not applicable, choose a null value.
    examples:
      - value: Aquaculture farm [ENVO:03600074]
  presampling_activity_id:
    name: presampling_activity_id
    slot_uri: GENEPIO:0102171
    title: presampling activity ID
    any_of:
      - range: WhitespaceMinimizedString
      - range: NullValueMenu
    description: The user-defined identifier assigned to a specific event that occured prior to sample collection.
    comments:
      - Store the ID for the relevant event prior to sample collection, which impacts the sample or sample collection process. For example, a flood event occuring in 2025 is the reason for these samples being collected.
    examples:
      - value: Presampling event 12345
  presampling_activity_date:
    name: presampling_activity_date
    slot_uri: GENEPIO:0102172
    title: presampling activity date
    range: date
    description: The date of the presampling event.
    comments:
      - Provide the date of the presampling event. If this date was over a range provide the start date.
    examples:
      - value: '2025-01-01'
  presampling_activity_date_null_reason:
    name: presampling_activity_date_null_reason
    title: presampling activity date null reason
    range: NullValueMenu
  presampling_activity:
    name: presampling_activity
    slot_uri: GENEPIO:0100433
    title: presampling activity
    any_of:
      - range: PresamplingActivityMenu
      - range: NullValueMenu
    description: The activities or variables prior to sample collection that may affect the sample.
    multivalued: true
    exact_mappings:
      - NCBI_BIOSAMPLE_SARS_COV_2_WWS:ww_pre_treatment
      - NCBI_BIOSAMPLE_SARS_COV_2_WWS:ww_sample_matrix
      - NCBI_BIOSAMPLE:ww_pre_treatment
      - NCBI_BIOSAMPLE:ww_sample_matrix
      - ENA_GSC_MIxS_WW_ERC00023:sample%20material%20processing
      - NCBI_BIOSAMPLE_PHA4GE_WWS:presampling_activity
    comments:
      - If there was an activity that would affect the sample prior to collection (this is different than sample processing), provide the activities by selecting one or more values from the template pick list. If the information is unknown or cannot be provided, leave blank or provide a null value.
    examples:
      - value: Agricultural activity [ENVO:01001442]
  presampling_activity_details:
    name: presampling_activity_details
    slot_uri: GENEPIO:0100434
    title: presampling activity details
    any_of:
      - range: WhitespaceMinimizedString
      - range: NullValueMenu
    description: The details of the activities or variables that affected the sample collected.
    exact_mappings:
      - NCBI_BIOSAMPLE_SARS_COV_2_WWS:description
      - NCBI_BIOSAMPLE:description
      - ENA_GSC_MIxS_WW_ERC00023:sample%20material%20processing
    comments:
      - Briefly describe the presampling activities using free text.
    examples:
      - value: Agricultural waste from large farm contributes waste to the site sampled.
  collection_device:
    name: collection_device
    slot_uri: GENEPIO:0001234
    title: collection device
    any_of:
      - range: CollectionDeviceMenu
      - range: NullValueMenu
    recommended: true
    description: The instrument or container used to collect the sample e.g. grab sampler.
    multivalued: true
    exact_mappings:
      - GISAID:Specimen%20source
      - NCBI_BIOSAMPLE_SARS_COV_2_WWS:isolation_source
      - NCBI_BIOSAMPLE_SARS_COV_2_WWS:ww_sample_type
      - NCBI_BIOSAMPLE:isolation_source
      - NCBI_BIOSAMPLE:ww_sample_type
      - ENA_GSC_MIxS_WW_ERC00023:sample%20collection%20device
      - iMicroSeq_Portal:collection%20device
      - NCBI_BIOSAMPLE_PHA4GE_WWS:collection_device
      - NCBI_BIOSAMPLE_Pathogen:isolation_source
    comments:
      - Provide a descriptor of the device used for sampling. Use the picklist provided in the template. If not applicable, choose a null value.
    examples:
      - value: Grab sampler [GENEPIO:0100941]
  collection_method:
