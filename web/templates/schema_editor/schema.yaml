id: https://example.com/DH_LinkML
name: DH_LinkML
title: Schema Editor for Data Harmonizer
description: The DataHarmonizer template for editing a {{schema}}.
version: 2.0.0
in_language: en
imports:
  - linkml:types
prefixes:
  linkml: https://w3id.org/linkml/
  ONTOLOGY: http://purl.obolibrary.org/obo/ONTOLOGY_
classes:
  Schema:
    name: Schema
    title: Schema
    description: A {{schema}} contains a list of {{slots}}, {{classes}} and their own linked or custom {{slots}}, and {{enumerations}} (which are menus of {{permissible values}} that are used in {{slots}}). DataHarmonizer templates are composed of one or more interrelated {{classes}} which appear as tabs in the DataHarmonizer interface.
    see_also:
      - templates/schema_editor/SOP.pdf
    unique_keys:
      schema_key:
        description: A schema is uniquely identified by its name.
        unique_key_slots:
          - name
    slots:
      - name
      - id
      - title
      - description
      - version
      - in_language
      - locales
      - default_prefix
      - imports
      - see_also
    slot_usage:
      name:
        name: name
        rank: 1
        slot_group: key
        title: Schema ID
        identifier: true
        pattern: ^[a-zA-Z_][a-zA-Z0-9._-]*$
        description: The script-compatible name of a LinkML {{schema}}.
        comments:
          - "This is a coding-compatible name formatted with XML xs:ncname constraints, namely no whitespace or colon allowed, and must lead with an alphabet character. LinkML recommends the standard **CamelCase** naming convention which omits dashes and underscores.  This format enables software tools to work with it without character processing issues.\nA LinkML schema contains classes for describing one or more tables (LinkML classes), fields/columns (slots), and picklists (enumerations). DataHarmonizer can be set up to display each table on a separate tab. A schema can also specify other schemas to import, making their slots, classes, etc. available for reuse."
        examples:
          - value: Wastewater
        range: WhitespaceMinimizedString
        required: true
      id:
        name: id
        rank: 2
        slot_group: key
      title:
        name: title
        rank: 3
        slot_group: attributes
        description: Plain language name of the {{schema}}.
        required: true
      description:
        name: description
        rank: 4
        slot_group: attributes
        description: The plain language description of this LinkML {{schema}}.
        range: string
        required: true
      version:
        name: version
        rank: 5
        slot_group: attributes
        required: true
        description: The semantic version identifier for this LinkML {{schema}}.
        examples:
          - value: 1.2.3
        pattern: ^\d+\.\d+\.\d+$
        comments:
          - See https://semver.org/
      in_language:
        name: in_language
        rank: 6
        slot_group: attributes
      locales:
        name: locales
        rank: 7
        slot_group: attributes
      default_prefix:
        name: default_prefix
        rank: 8
        slot_group: attributes
      imports:
        name: imports
        rank: 9
        slot_group: attributes
      see_also:
        name: see_also
        rank: 10
        slot_group: attributes
        description: A delimited list of URLs to supporting documentation; or possibly a local relative file path containing such information.
  Class:
    name: Class
    title: Class
    description: A view of the current {{schema}}'s {{class}} specifications. A {{class}} may be a top-level DataHarmonizer "template" that can be displayed in a spreadsheet tab, or it may be a subordinate 1-many {{class}} linked to a parent {{class}} by a primary-to-foreign key {{slot}} relationship.
    unique_keys:
      class_key:
        description: A table (class) is uniquely identified by the schema it appears in as well as its name.
        unique_key_slots:
          - schema_id
          - name
    slots:
      - schema_id
      - name
      - title
      - description
      - see_also
      - version
      - class_uri
      - is_a
      - tree_root
    slot_usage:
      schema_id:
        name: schema_id
        rank: 1
        slot_group: key
        range: Schema
        description: The script-compatible name of the {{schema}} this {{class}} is contained in.
      name:
        name: name
        rank: 2
        slot_group: key
        title: Class ID
        pattern: ^([A-Z]+[a-z0-9]*)+$
        description: The script-compatible name of this {{class}}.
        comments:
          - "This is name formatted in the standard **CamelCase** naming convention. This format enables software tools to work with it without character processing issues.\nEach table can be displayed in DataHarmonizer in a spreadsheet tab. A table may be visible as a top-level DataHarmonizer template\", or it may be a subordinate 1-many table linked to a parent table by a primary key field."
        examples:
          - value: WastewaterAMR|WastewaterPathogenAgnostic
        range: WhitespaceMinimizedString
        required: true
      title:
        name: title
        rank: 3
        slot_group: attributes
        description: The plain language name of this {{class}}.
        required: true
      description:
        name: description
        rank: 4
        slot_group: attributes
        description: The plain language description of this {{class}}.
        range: string
        required: true
      see_also:
        name: see_also
        rank: 5
        slot_group: attributes
        description: A delimited list of URLs to supporting documentation; or possibly a local file path containing such information.
      version:
        name: version
        rank: 6
        slot_group: technical
        description: A semantic version identifier for this {{class}} content.
        pattern: ^\d+\.\d+\.\d+$
        comments:
          - See https://semver.org/
      class_uri:
        name: class_uri
        rank: 7
        slot_group: technical
      is_a:
        name: is_a
        rank: 8
        slot_group: technical
        title: Is a
        range: SchemaClassMenu
        description: A parent {{class}} that this {{class}} inherits attributes from.
      tree_root:
        name: tree_root
        rank: 9
        slot_group: technical
  Slot:
    name: Slot
    title: Slot
    description: A view of the {{slots}} used in the currently selected {{schemas}}. {{Schema}}-level {{slots}} can be reused in one or more {{class}} specifications, or can be stand-alone {{slots}} occuring directly as {{attributes}} in a single {{class}}. A {{slot}} defines a column in a template, and can be a basic number, date, string, or menu of one or more {{enumerations}}, or other single-{{slot}} datatype.
    unique_keys:
      slot_key:
        description: A slot is uniquely identified by the schema it appears in as well as its name and any class that it may appear in.
        unique_key_slots:
          - schema_id
          - slot_type
          - class_id
          - name
    slots:
      - schema_id
      - slot_type
      - class_id
      - slot_group
      - name
      - rank
      - slot_uri
      - title
      - description
      - comments
      - examples
      - range
      - unit
      - required
      - recommended
      - ifabsent
      - identifier
      - multivalued
      - minimum_value
      - maximum_value
      - minimum_cardinality
      - maximum_cardinality
      - todos
      - pattern
      - structured_pattern
      - ifabsent
      - equals_expression
      - inlined
      - inlined_as_list
      - aliases
      - exact_mappings
      - notes
      - version
    slot_usage:
      schema_id:
        name: schema_id
        rank: 1
        slot_group: key
        range: SchemaMenu
        description: The script-compatible name of the {{schema}} that this {{slot}} is contained in.
        comments:
          - A {{schema}} has a list of {{slots}} it defines. (In future the SchemaEditor will enable a {{schema}} to import other schemas' {{slots}}).
      class_id:
        name: class_id
        rank: 2
        slot_group: key
        description: Provide a {{class}} name in order to locate this {{slot}} in the given {{class}}. Otherwise the {{slot}} will be located in the {{schema}}'s list of {{slots}}.
      slot_type:
        name: slot_type
        rank: 2
        slot_group: key
      slot_group:
        name: slot_group
        rank: 4
        slot_group: key
      name:
        name: name
        rank: 5
        slot_group: key
        title: Slot ID
        required: true
        pattern: ^[a-z]+[a-z0-9_]*$
        description: The script-compatible name of this {{slot}}.
        comments:
          - "This name is formatted as a standard lowercase **snake_case** formatted name.\nA field can be used in one or more tables. A field can be shown as a visible datatype column in a spreadsheet (DataHarmonizer template) tab, and can define (in its range attribute) a basic number, date, string, picklist (categorical or ordinal), or other custom datatype.  A slot may also have a range pointing to more complex classes."
        any_of:
          - range: WhitespaceMinimizedString
          - range: SchemaSlotMenu
      rank:
        name: rank
        rank: 6
        slot_group: attributes
        description: An integer which sets the order of this {{slot}} relative to the others within a given {{class}}. In SchemaEditor, this is automatically set when on the {{slot}} tab by dragging {{slots}} into the desired order; this is also recalculated when {{slot groups}} are reordered.
      slot_uri:
        name: slot_uri
        rank: 7
        slot_group: attributes
      title:
        name: title
        rank: 8
        slot_group: attributes
        description: The plain language name of this {{slot}}.
        comments:
          - This can be displayed in applications and documentation.
        required: true
      description:
        name: description
        rank: 9
        slot_group: attributes
        range: string
        required: true
        description: A plan text description of this {{slot}}.
      comments:
        name: comments
        rank: 10
        slot_group: attributes
      examples:
        name: examples
        rank: 11
        slot_group: attributes
      range:
        name: range
        rank: 12
        slot_group: attributes
      unit:
        name: unit
        rank: 13
        slot_group: attributes
      required:
        name: required
        rank: 14
        slot_group: attributes
      recommended:
        name: recommended
        rank: 15
        slot_group: attributes
      ifabsent:
        name: ifabsent
        rank: 26
        slot_group: attributes
        description: Specify a default value for a {{slot}} using the syntax shown in the examples.
        examples:
          - value: 'For strings: string(default value)'
          - value: 'For integer: int(42)'
          - value: 'For float: float(0.5)'
          - value: 'For boolean: True'
          - value: 'For dates: date("2020-01-31")'
          - value: 'For datetime: datetime("2020-01-31T12:00:00Z")'
      identifier:
        name: identifier
        rank: 17
        slot_group: attributes
      multivalued:
        name: multivalued
        rank: 18
        slot_group: attributes
      minimum_value:
        name: minimum_value
        rank: 19
        slot_group: attributes
      maximum_value:
        name: maximum_value
        rank: 20
        slot_group: attributes
      minimum_cardinality:
        name: minimum_cardinality
        rank: 21
        slot_group: attributes
      maximum_cardinality:
        name: maximum_cardinality
        rank: 22
        slot_group: attributes
      todos:
        name: todos
        rank: 23
        slot_group: attributes
      pattern:
        name: pattern
        rank: 24
        slot_group: attributes
      structured_pattern:
        name: structured_pattern
        rank: 25
        slot_group: attributes
      equals_expression:
        name: equals_expression
        rank: 27
        slot_group: attributes
      inlined:
        name: inlined
        rank: 28
        slot_group: attributes
      inlined_as_list:
        name: inlined_as_list
        rank: 29
        slot_group: attributes
      aliases:
        name: aliases
        rank: 30
        slot_group: attributes
      exact_mappings:
        name: exact_mappings
        rank: 31
        slot_group: attributes
        multivalued: true
        title: Exact mappings
        description: A list of one or more Curies or URIs that point to terms that are semantically identical to this {{slot}}.
      notes:
        name: notes
        rank: 32
        slot_group: attributes
        title: Editorial notes
        description: Editorial notes about this {{slot}} intended primarily for internal consumption
      version:
        name: version
        rank: 33
        slot_group: attributes
        description: A version number (or date) indicating when this {{slot}} was introduced.
  Enum:
    name: Enum
    title: Enum
    description: A view of the {{enumerations}} in selected {{schemas}}. An {{enumeration}} can be used in the "range" or "any of" or "one of" {{attribute}} of a {{slot}}. Each {{enumeration}} has a flat list or hierarchy of {{permissible values}}.
    unique_keys:
      enum_key:
        description: An enumeration is uniquely identified by the schema it appears in as well as its name.
        unique_key_slots:
          - schema_id
          - name
    slots:
      - schema_id
      - name
      - title
      - description
      - enum_uri
      - inherits
    slot_usage:
      schema_id:
        name: schema_id
        rank: 1
        slot_group: key
        range: Schema
        description: The script-compatible name of the {{schema}} this {{enumeration}} is contained in.
      name:
        name: name
        rank: 2
        slot_group: key
        title: Enum ID
        required: true
        pattern: ^([A-Z]+[a-z0-9]*)+$
        description: The script-compatible name of this {{enumeration}} menu of terms.
        comments:
          - See https://linkml.io/linkml/schemas/enums.html and https://linkml.io/linkml-model/latest/docs/EnumDefinition/
        examples:
          - value: "- NullValueMenu\n- ComplicationsMenu\n- HostDiseaseMenu\n- HostCommonNameMenu"
        any_of:
          - range: WhitespaceMinimizedString
          - range: SchemaEnumMenu
      title:
        name: title
        rank: 3
        slot_group: attributes
        description: The plain language name of this {{enumeration}} menu of terms.
        comments:
          - "The plain language \"Title\" label should mirror the \"Name\" label, and should use ordinary textual punctuation.\n\nFor more information see\nhttps://linkml.io/linkml-model/latest/docs/title/"
        examples:
          - value: "- null value menu\n- Complications menu\n- Host Disease Menu\n- host (common name) menu"
        required: true
      description:
        name: description
        rank: 4
        slot_group: attributes
        range: string
        description: A plain text description of this {{enumeration}} menu.
        comments:
          - "Plain language sentence(s) using ordinary textual punctuation.\n\nFor more information see\nhttps://linkml.io/linkml-model/latest/docs/description/"
        examples:
          - value: 'NullValueMenu Description: A picklist menu of  International Nucleotide Database Collaboration (INSDC) standardised missing/null value reporting language to be used where a value of an expected format for sample metadata reporting can not be provided. [source: https://ena-docs.readthedocs.io/en/latest/submit/samples/missing-values.html]'
      enum_uri:
        name: enum_uri
        rank: 5
        slot_group: attributes
      inherits:
        name: inherits
        rank: 6
        slot_group: attributes
  PermissibleValue:
    name: PermissibleValue
    title: Permissible Value
    description: A view of selected {{schema}} {{enumeration}} choices.
    unique_keys:
      permissiblevalue_key:
        description: A permissible value is uniquely identified by the schema it appears in as well as its enumeration name and its text attribute.
        unique_key_slots:
          - schema_id
          - enum_id
          - text
    slots:
      - schema_id
      - enum_id
      - text
      - title
      - is_a
      - description
      - meaning
      - exact_mappings
      - notes
    slot_usage:
      schema_id:
        name: schema_id
        rank: 1
        slot_group: key
        range: Schema
        description: The script-compatible name of the {{schema}} this {{enumeration}} menu choice is contained in.
      enum_id:
        name: enum_id
        rank: 2
        slot_group: key
        range: Enum
        description: The script-compatible name of the menu that this choice is contained in.
        comments:
          - "To edit this value please refer to it within the \"Name\" column of the \"Picklist\" tab. Editing it there will change the \"Picklist\" name without impacting any underlying \"Picklist choices\". The code name should be formatted in the standard **CamelCase** naming convention. This format enables software tools to work with it without character processing issues.\n\nFor more information see\nhttps://linkml.io/linkml/schemas/enums.html\nhttps://linkml.io/linkml-model/latest/docs/EnumDefinition/"
        examples:
          - value: "- NullValueMenu\n- ComplicationsMenu\n- HostDiseaseMenu\n- HostCommonNameMenu"
      text:
        name: text
        rank: 3
        slot_group: key
      title:
        name: title
        rank: 4
        slot_group: attributes
        description: The plain language title of this menu choice (LinkML PermissibleValue) to display. If none, the code will be displayed.
        comments:
          - 'Suggestion: If empty, the "Code" value will be displayed.'
        examples:
          - value: "Class: Nasopharynx (NP)\nUser Interface Label: rhinopharynx\n\nClass: UBERON:0001728\nUser Interface Label: Nasopharynx (NP)"
      is_a:
        name: is_a
        rank: 5
        slot_group: attributes
        title: Parent Code
        range: WhitespaceMinimizedString
        description: For an {{enumeration}} which provide a hierarchy of {{permissible values}}, specify the parent code/key (within this {{enumeration}}) of this {{permissible value}}, if any.
        comments:
          - "Create a picklist hierarchy by declaring code (LinkML permissible_vaue key) that you wish to be the parent of the value. Only refer to a parent class/choice/permissible value that has already been created under the \"Class\" column within this specific picklist. When no parent class is declared, the associated \"class\" remains at the top level of the picklist menu.\n\nFor more information see\nhttps://linkml.io/linkml-model/latest/docs/is_a/"
        examples:
          - value: "Input for \"Class: | Parent Class:\"\n- Class: Lower respiratory tract\n- Class: Bronchus | Parent Class: Lower respirtory tract\n- Class: Lung | Parent Class: Lower respiratory tract\n- Class: Bronchiole | Parent Class: Lung\n\nResulting Picklist:\n- Lower respiratory tract\n--- Bronchus\n--- Lung\n------Bronchiole"
      description:
        name: description
        rank: 6
        slot_group: attributes
        range: string
        description: A plain text description of the meaning of this menu choice.
        comments:
          - "Plain language sentence(s) using ordinary textual punctuation. If using a URI/CURIE in the \"URI\" column, it is recommended to use the associated definition. When applicable, indicate the definition source(s) within square brackets \"[ ]\" after the description.\n\nFor more information see\nhttps://linkml.io/linkml-model/latest/docs/description/"
        examples:
          - value: "Class: nasopharynx\nDescription: The section of the pharynx that lies above the soft palate. [UBERON:0001728]\n\nor \n\nThe uppermost of the three regions of the throat (pharynx), situated behind the nasal cavity and extending from the posterior nares to the level above the soft palate. [TFD][VHOG]"
      meaning:
        name: meaning
        rank: 7
        slot_group: attributes
      exact_mappings:
        name: exact_mappings
        rank: 8
        slot_group: attributes
        multivalued: true
        title: Code mappings
        description: A list of terms from other schemas or terminology systems that mean exactly the same thing as this term.
        comments:
          - "This field is used to point to concepts in external standards that are fully equivalent to the current term, helping both people and software systems recognize that they refer to the same idea. It is aligned with skos:exactMatch and inherits its behavior and purpose from mappings.\n\n\"A skos:exactMatch link indicates a high degree of confidence that two concepts can be used interchangeably across a wide range of information retrieval applications.\" - https://www.w3.org/TR/skos-reference/#L4858\n\nFor more information see\nhttps://linkml.io/linkml-model/latest/docs/exact_mappings/"
        examples:
          - value: "Class: Pacific Biosciences [GENEPIO:0001927]\nMapping: ENA_GSC_MIxS_WW_ERC00023:PACBIO_SMRT\n\nNote: \"ENA_GSC_MIxS_WW_ERC00023\" is the database and submission type prefix used to identify the target export, while \"PACBIO_SMRT\" is the export format required for this specific class."
      notes:
        name: notes
        rank: 9
        slot_group: attributes
        title: Editorial Notes
        description: Editorial notes about an element intended primarily for internal consumption
        comments:
          - "Plain language sentence(s), using ordinary textual punctuation, providing organization specific comments (E.g., curation information or schema editor comments).\n\nFor more information see\nhttps://linkml.io/linkml-model/latest/docs/notes/"
        examples:
          - value: Discuss with schema workgroup whether the we should add the abbreviation "(NP)" to the "User Interface Label" for the "nasopharynx" "Class".
  UniqueKey:
    name: UniqueKey
    title: Unique Key
    description: A view of the {{class}} single or multi-component unique key(s) which often dictate record uniqueness and which can participate in primary / foreign key relationships.
    unique_keys:
      uniquekey_key:
        description: A slot is uniquely identified by the schema it appears in as well as its name
        unique_key_slots:
          - schema_id
          - class_id
          - name
    slots:
      - schema_id
      - class_id
      - name
      - unique_key_slots
      - description
      - notes
    slot_usage:
      schema_id:
        name: schema_id
        rank: 1
        slot_group: key
        range: Schema
        description: The script-compatible name of the {{schema}} that this {{UniqueKey}} is in.
      class_id:
        name: class_id
        rank: 3
        slot_group: key
        required: true
        description: The script-compatible name of the {{class}} that this {{UniqueKey}} is in.
      name:
        name: name
        rank: 3
        slot_group: key
        title: Unique Key ID
        pattern: ^[a-z]+[a-z0-9_]*$
        description: The script-compatible name of this {{UniqueKey}}.
        range: WhitespaceMinimizedString
        required: true
      unique_key_slots:
        name: unique_key_slots
        rank: 4
        slot_group: technical
      description:
        name: description
        rank: 5
        slot_group: technical
        range: WhitespaceMinimizedString
        description: The description of this {{UniqueKey}}.
      notes:
        name: notes
        rank: 6
        slot_group: technical
        title: Editorial Notes
        description: Editorial notes about an element intended primarily for internal consumption
  Annotation:
    name: Annotation
    title: Annotation
    description: An annotation is a {{slot}} attached directly to a {{schema}}, {{class}}, {{slot}}, {{enum}}, {{permissible value}} or {{rule}}. An annotation is free to set its own {{slot}} attributes, it doesn't inherit anything from {{schema}} {{slots}}.  Like a {{class}} {{slot}}, an {{annotation}} can define a visible column in a template, and can be a basic number, date, string, {{Enum}} (categorical or ordinal), or other single-{{slot}} datatype.
    unique_keys:
      annotation_key:
        description: An annotation is uniquely identified by the schema it appears in as well as its name and annotation type (schema, class, slot, slot_usage, attribute)
        unique_key_slots:
          - schema_id
          - annotation_type
          - name
    slots:
      - schema_id
      - annotation_type
      - class_name
      - slot_name
      - name
      - value
    slot_usage:
      schema_id:
        name: schema_id
        rank: 1
        slot_group: key
        range: Schema
        description: The script-compatible name of the {{schema}} this {{annotation}} is located in.
      annotation_type:
        name: annotation_type
        rank: 2
        slot_group: key
      class_name:
        name: class_name
        rank: 3
        slot_group: key
      slot_name:
        name: slot_name
        rank: 4
        slot_group: key
      name:
        name: name
        rank: 5
        slot_group: key
        title: Key
        range: WhitespaceMinimizedString
        required: true
        pattern: ^[a-z]+[a-z0-9_]*$
        description: The annotation key (i.e. coding name of the annotation).
        comments:
          - This is a lowercase **snake_case** formatted name in the LinkML standard naming convention.
      value:
        name: value
        rank: 6
        slot_group: attributes
        description: The annotation’s value, which can be a string or an object of any kind (in non-serialized data).
  EnumSource:
    name: EnumSource
    title: Enum Source
    description: A view of all the external (URI reachable) sources for selected {{enumerations}}. This includes specifications for extracting nodes or branches for inclusion or exclusion in each {{enumeration}}.
    unique_keys:
      enum_source_key:
        description: A picklist source consists of the schema, enumeration, inclusion or exclusion flag, and source URI of the ontology.
        unique_key_slots:
          - schema_id
          - enum_id
          - criteria
          - source_ontology
    slots:
      - schema_id
      - enum_id
      - criteria
      - source_ontology
      - is_direct
      - source_nodes
      - include_self
      - relationship_types
    slot_usage:
      schema_id:
        name: schema_id
        rank: 1
        slot_group: key
        range: Schema
        description: The script-compatible name of the {{schema}} this {{enumeration}} inclusion and exclusion criteria pertain to.
      enum_id:
        name: enum_id
        rank: 2
        slot_group: key
        range: Enum
        description: The script-compatible name of the {{enumeration}} that this inclusion criteria pertains to.
      criteria:
        name: criteria
        rank: 3
        slot_group: key
      source_ontology:
        name: source_ontology
        rank: 4
        slot_group: key
      is_direct:
        name: is_direct
        rank: 5
        slot_group: technical
      source_nodes:
        name: source_nodes
        rank: 6
        slot_group: technical
      include_self:
        name: include_self
        rank: 7
        slot_group: technical
      relationship_types:
        name: relationship_types
        rank: 8
        slot_group: technical
  Prefix:
    name: Prefix
    title: Prefix
    description: A view of the list of prefixes used in a {{schema}}. Prefixes provide namespaces that can be used within a system. See https://en.wikipedia.org/wiki/CURIE
    unique_keys:
      prefix_key:
        description: A prefix is uniquely identified by the schema it appears in as well as its currie prefix.
        unique_key_slots:
          - schema_id
          - prefix
    slots:
      - schema_id
      - prefix
      - reference
    slot_usage:
      schema_id:
        name: schema_id
        rank: 1
        slot_group: key
        range: Schema
        description: The script-compatible name of the {{schema}} this prefix is listed in.
      prefix:
        name: prefix
        rank: 2
        slot_group: key
      reference:
        name: reference
        rank: 3
        slot_group: attributes
  Setting:
    name: Setting
    title: Setting
    description: A view of settings associated with selected {{schemas}}. A setting is usually a regular expression that can be reused in a structured_pattern slot attribute. See:https://linkml.io/linkml/faq/modeling.html#can-i-reuse-regular-expression-patterns.
    unique_keys:
      settings_key:
        description: A setting is uniquely identified by the name key whose value is a regular expression.
        unique_key_slots:
          - schema_id
          - name
    slots:
      - schema_id
      - name
      - value
      - description
    slot_usage:
      schema_id:
        name: schema_id
        rank: 1
        slot_group: key
        range: Schema
        description: The script-compatible name of the {{schema}} this setting is contained in.
      name:
        name: name
        rank: 2
        slot_group: key
        title: Name
        range: WhitespaceMinimizedString
        required: true
        pattern: ^[a-zA-Z_][a-zA-Z0-9._-]*$
        description: The script-compatible name of this setting which can be referenced in a Linkml structured_pattern expression. See https://linkml.io/linkml/schemas/{{enums}}.html and https://linkml.io/linkml-model/latest/docs/EnumDefinition/ . The name should conform to XML xs:NCName syntax.
      value:
        name: value
        rank: 3
        slot_group: attributes
        required: true
        description: The setting’s value, which is a regular expression that can be used in a LinkML structured_pattern expression {{slot}}.
      description:
        name: description
        rank: 4
        slot_group: attributes
        range: string
        description: A plan text description of this setting.
  Rule:
    name: Rule
    title: Rule
    description: A view of selected {{schema}}'s rules that execute the change in state of one or more {{slots}}. Each rule has a "precondition" expression of constraints one or more {{slots}}' values and a postcondition expression stating what the same or other {{slot's}} values change to.
  Extension:
    name: Extension
    title: Extension
    description: A view of selected {{schemas}} list of LinkML attribute-value pairs that are not directly part of the {{schema}}'s {{class}}/{{slot}} standard structure. Locale information is held here.
    unique_keys:
      extension_key:
        description: A key which details each schema's extension.
        unique_key_slots:
          - schema_id
          - name
    slots:
      - schema_id
      - name
      - value
      - description
    slot_usage:
      schema_id:
        name: schema_id
        rank: 1
        slot_group: key
        range: Schema
      name:
        name: name
        rank: 2
        slot_group: key
        title: Name
        range: WhitespaceMinimizedString
        required: true
      value:
        name: value
        rank: 3
        slot_group: attributes
      description:
        name: description
        rank: 4
        slot_group: attributes
        range: string
        description: A plain text description of this extension. LinkML extensions allow saving any kind of object as a value of a key.
  Container:
    tree_root: true
    attributes:
      Schemas:
        range: Schema
        multivalued: true
        inlined_as_list: true
      Prefixes:
        range: Prefix
        multivalued: true
        inlined_as_list: true
      Settings:
        range: Setting
        multivalued: true
        inlined_as_list: true
      Extensions:
        range: Extension
        multivalued: true
        inlined_as_list: true
      Enums:
        range: Enum
        multivalued: true
        inlined_as_list: true
      PermissibleValues:
        range: PermissibleValue
        multivalued: true
        inlined_as_list: true
      EnumSources:
        range: EnumSource
        multivalued: true
        inlined_as_list: true
      Slots:
        range: Slot
        multivalued: true
        inlined_as_list: true
      Annotations:
        range: Annotation
        multivalued: true
        inlined_as_list: true
      Classes:
        range: Class
        multivalued: true
        inlined_as_list: true
      UniqueKeys:
        range: UniqueKey
        multivalued: true
        inlined_as_list: true
slots:
  schema_id:
    name: schema_id
    title: Schema ID
    required: true
    annotations:
      foreign_key:
        tag: foreign_key
        value: Schema.name
  class_id:
    name: class_id
    title: Class ID
    range: SchemaClassMenu
    annotations:
      foreign_key:
        tag: foreign_key
        value: Class.name
  slot_id:
    name: slot_id
    title: Slot ID
    description: The script-compatible name of a {{slot}} which is referenced by other {{classes}} when a primary/foreign key relationship is needed.
    required: true
    range: SchemaSlotMenu
    annotations:
      foreign_key:
        tag: foreign_key
        value: Slot.name
  enum_id:
    name: enum_id
    title: Enum ID
    required: true
    annotations:
      foreign_key:
        tag: foreign_key
        value: Enum.name
  name:
    name: name
  id:
    name: id
    title: URI
    range: uri
    required: true
    description: The unique URI for identifying this {{schema}}.
    identifier: true
    comments:
      - Typically the {{schema}} can be downloaded from this URI, but currently it is often left as an example URI during {{schema}} development. This semantic metadata helps in the comparison of datasets.
    examples:
      - value: https://example.com/GRDI
  title:
    name: title
    title: Title
    range: WhitespaceMinimizedString
  description:
    name: description
    title: Description
  version:
    name: version
    title: Version
    range: WhitespaceMinimizedString
  in_language:
    name: in_language
    title: Default language
    range: LanguagesMenu
    description: This is the default language (ISO 639-1 Code) that the given {{schema}} {{class}}, {{slot}} and {{enumeration}} titles, descriptions and other textual items are in.
    comments:
      - This is often “en” for English.
    examples:
      - value: English (en)
  locales:
    name: locales
    title: Translations
    range: LanguagesMenu
    description: For multilingual schemas, a list of (ISO 639-1) languages (codes) which translations can be provided for.
    multivalued: true
    comments:
      - Language translations are held in the {{schema's}} extensions.locales data structure.
    examples:
      - value: French (fr)
  default_prefix:
    name: default_prefix
    title: Default prefix
    range: uri
    required: true
    description: A prefix that all schema elements can be addressed by.
  imports:
    name: imports
    title: Imports
    range: WhitespaceMinimizedString
    description: A list of linkml:[import name] schemas to import and reuse.
    multivalued: true
    comments:
      - Currently only the default linkml:types is implemented.
  see_also:
    name: see_also
    title: See Also
    range: WhitespaceMinimizedString
    multivalued: true
  prefix:
    name: prefix
    title: Prefix
    range: WhitespaceMinimizedString
    required: true
    description: The namespace prefix string.
  reference:
    name: reference
    title: Reference
    range: uri
    required: true
    description: The URI the prefix expands to.
  class_uri:
    name: class_uri
    title: Semantic URI
    range: uri
    description: A URI for identifying this {{class's}} semantic type.
    comments:
      - This semantic metadata helps in the comparison of datasets.
  is_a:
    name: is_a
  tree_root:
    name: tree_root
    title: Root Class
    range: boolean
    description: A boolean indicating whether this is a specification for a top-level data container on which serializations are based.
    comments:
      - Only one allowed per {{schema}}. See https://linkml.io/linkml/data/csvs.html
  unique_key_slots:
    name: unique_key_slots
    title: Unique key slots
    range: UniqueKeySlotMenu
    required: true
    description: A list of a {{class's}} {{slots}} that make up a {{unique key}}
    multivalued: true
    comments:
      - See https://linkml.io/linkml/schemas/constraints.html
  notes:
    name: notes
    range: WhitespaceMinimizedString
  rank:
    name: rank
    title: Ordering
    range: integer
  slot_type:
    name: slot_type
    title: Type
    range: SchemaSlotTypeMenu
    required: true
    description: "The type of {{slot}} that this {{slot}} definition record pertains to: either a {{schema}}-level shared {{slot}}, a {{schema slot}} reused in a {{class}}, or a {{slot}} only defined in a {{class}}."
    comments:
      - "In a LinkML schema, a field definition (LinkML slot definition) can exist within one of three contexts:\n1) A field which is defined at the schema level, and which can be shared by more than one table (LinkML class).\n2) A field which a table reuses from its schema's list of fields. Here a table cannot change any schema-defined attributes of the field; it can only add attribute values for empty attributes.  In LinkML such fields and their customized attributes appear in the table's \"slot_usage\" list.\n3) A field which is named only in a given table, and does not appear or inherit any attributes from the schema. (In LinkML such fields appear only in a table’s “attributes” list.)"
  slot_group:
    name: slot_group
    title: Section
    range: SchemaSlotGroupMenu
    description: The name of a grouping to place this {{slot}} within during presentation in a {{class}}.
  slot_uri:
    name: slot_uri
    title: Semantic URI
    range: uri
    description: A URI for identifying this {{slot's}} semantic type.
  comments:
    name: comments
    title: Comments
    range: WhitespaceMinimizedString
    description: A free text field for adding other comments to guide usage of this {{slot}}.
  examples:
    name: examples
    title: Examples
    range: WhitespaceMinimizedString
    multivalued: true
    description: One or more example values for this {{slot}}.
  range:
    name: range
    title: Range
    any_of:
      - range: SchemaTypeMenu
      - range: SchemaClassMenu
      - range: SchemaEnumMenu
    required: true
    description: The data type or {{enumeration}} range or ranges that a {{slot's}} value can be validated by. If more than one, this appears in the {{slot's}} specification as a list of "any of" or "one of" ranges.
    multivalued: true
  unit:
    name: unit
    title: Unit
    range: WhitespaceMinimizedString
    description: A unit for a numeric {{slot}}, expressed in the Unified Code for Units of Measure (UCUM, https://ucum.org/) codes. A UCUM code can be looked up at https://units-of-measurement.org/
  required:
    name: required
    title: Required
    range: boolean
    description: A boolean TRUE indicates this {{slot}} is a mandatory data {{slot}}.
    comments:
      - A mandatory data {{slot}} will fail validation if empty.
  recommended:
    name: recommended
    title: Recommended
    range: boolean
    description: A boolean TRUE indicates this {{slot}} is a recommended data {{slot}}.
  ifabsent:
    name: ifabsent
    title: Default value
    range: WhitespaceMinimizedString
  identifier:
    name: identifier
    title: Identifier
    range: boolean
    description: A boolean TRUE indicates this {{slot}} is an identifier such that each of its values must be unique within the {{class}} set of records. In LinkML, “If a {{slot}} is declared as an identifier then it serves as a {{UniqueKey}} for members of that {{class}}. It can also be used for inlining as a dict in JSON serializations.”
  multivalued:
    name: multivalued
    title: Multivalued
    range: boolean
    description: A boolean TRUE indicates this {{slot}} can hold more than one value taken from its range.
  minimum_value:
    name: minimum_value
    title: Minimum value
    range: integer
    description: A minimum value which is appropriate for the range data type of the {{slot}}.
  maximum_value:
    name: maximum_value
    title: Maximum value
    range: integer
    description: A maximum value which is appropriate for the range data type of the {{slot}}.
  minimum_cardinality:
    name: minimum_cardinality
    title: Minimum cardinality
    range: integer
    description: For a multivalued {{slot}}, a minimum count of values required.
  maximum_cardinality:
    name: maximum_cardinality
    title: Maximum cardinality
    range: integer
    description: For a multivalued {{slot}}, a maximum count of values required.
  todos:
    name: todos
    title: Conditional
    range: WhitespaceMinimizedString
    description: A semicolon-delimited list of simple conditionals that pertain to this {{slot}} (e.g. ‘<={today}’ , or ‘<={some_other_field_name}’. This {{slot}} may also include “work in progress” notes.
    multivalued: true
  pattern:
    name: pattern
    title: Pattern
    range: WhitespaceMinimizedString
    description: A regular expression pattern used to validate a string {{slot's}} string value.
    comments:
      - Regular expressions can begin with ^ to ensure start of string is tested, and $ to ensure up to end is tested.
  structured_pattern:
    name: structured_pattern
    title: Structured pattern
    range: WhitespaceMinimizedString
    description: This is a concatenation of regular expression patterns which are made available in the {{schema}}'s settings. Each named expression gets replaced by its regular expression before validating the {{slot's}} string value against it.
  equals_expression:
    name: equals_expression
    title: Calculated value
    range: WhitespaceMinimizedString
    description: Enables inferring (calculating) value based on other {{slot}} values. This is a LinkML-script-processed expression, having the syntax of a python expression.
    comments:
      - See https://linkml.io/linkml/schemas/advanced.html#equals-expression
  inlined:
    name: inlined
    title: Inlined
    range: boolean
    description: Within the context of a JSON {{class}} representation, whether a complex (non-literal) {{slot's}} content should be represented directly or just represented by a key to another record.
  inlined_as_list:
    name: inlined_as_list
    title: Inlined as list
    range: boolean
    description: Within the context of a JSON {{class}} representation, whether a complex (non-literal) {{slot's}} content should be represented directly as a JSON list of items.
  aliases:
    name: aliases
    title: Aliases
    range: WhitespaceMinimizedString
    description: A list of other names that a {{slot}} can be known by.
    multivalued: true
    comments:
      - See https://linkml.io/linkml/schemas/metadata.html#providing-aliases
  exact_mappings:
    name: exact_mappings
    range: WhitespaceMinimizedString
    multivalued: true
  annotation_type:
    name: annotation_type
    title: Annotation on
    range: SchemaAnnotationTypeMenu
    required: true
    description: A menu of {{schema}} element types this annotation could pertain to ({{schema}}, {{class}}, {{slot}}; in future Enumeration …)
  class_name:
    name: class_name
    title: On class
    range: SchemaClassMenu
    description: If this annotation is attached to a {{class}}, provide the name of the {{class}}.
  slot_name:
    name: slot_name
    title: On slot
    range: SchemaSlotMenu
    description: If this annotation is attached to a {{slot}}, provide the name of the {{slot}}.
  value:
    name: value
    title: Value
    range: string
  enum_uri:
    name: enum_uri
    title: Semantic URI
    range: uri
    description: A URI for identifying this {{enumeration}}'s semantic type.
    comments:
      - This semantic metadata helps in the comparison of datasets.
    examples:
      - value: "CURIE Example =  CHEBI:138488\nURI Example = http://purl.obolibrary.org/obo/CHEBI_138488"
  inherits:
    name: inherits
    title: Inherits
    range: SchemaEnumMenu
    description: Indicates that this {{enumeration}} inherits {{permissible values}} from another menu, and includes or excludes other values (for selection and validation).
    comments:
      - "Select a menu from the \"Inherits\" dropdown list or copy and paste the \"Picklist Name (CamelCase)\" value for the menu you wish to use. Currently you can only inherit from menus listed within the \"Picklist\" tab of the schema you are editing. If the dropdown list is not appearing try resizing your browser menu.\n\nFor more information see\nhttps://linkml.io/linkml-model/latest/docs/inherits/"
    examples:
      - value: HostCommonNameMenu
  text:
    name: text
    title: Code
    range: WhitespaceMinimizedString
    required: true
    description: The textual code for the {{permissible value}} item.
    comments:
      - An {{enumeration's}} codes must be unique. Note that whether an {{enumeration}} label or its code is visible in a data file depends on the data file format. JSON formatted data files hold codes directly, and thus enforce standardization. CSV, TSV, XLS, and XLSX data formats receive the choice's label. This enables saving of multilingual data in language of choice.
    examples:
      - value: "- Lower respiratory tract\n- Bronchus\n- Lung\n- Bronchiole"
  meaning:
    name: meaning
    title: Semantic URI
    range: uri
    description: A URI for identifying this item's semantic type.
    comments:
      - "Suggestion: Input a URI or CURIE (Compact uniform resource identifier).\n\nFor more information see\nhttps://linkml.io/linkml-model/latest/docs/meaning/\nhttps://en.wikipedia.org/wiki/Uniform_Resource_Identifier\nhttps://cthoyt.com/2021/09/14/curies.html"
    examples:
      - value: "CURIE Example =  UBERON:0001728\nURI Example = http://purl.obolibrary.org/obo/UBERON_0001728"
  criteria:
    name: criteria
    title: Criteria
    range: EnumCriteriaMenu
    required: true
    description: Whether to include or exclude (minus) the source ontology’s given terms (and their underlying terms, if any).
  source_ontology:
    name: source_ontology
    title: Source ontology
    range: uri
    description: The URI of the source ontology to trust and fetch terms from.
  is_direct:
    name: is_direct
    title: Directly downloadable
    range: boolean
    description: Can the vocabulary source be automatically downloaded and processed, or is a manual process involved?
  source_nodes:
    name: source_nodes
    title: Top level term ids
    range: uriorcurie
    description: The selection of term nodes (and their underlying terms) to allow or exclude selections from, and to validate data by.
    multivalued: true
  include_self:
    name: include_self
    title: Include top level terms
    range: boolean
    description: Include the listed selection of items (top of term branch or otherwise) as selectable items themselves.
  relationship_types:
    name: relationship_types
    title: Relations
    range: WhitespaceMinimizedString
    description: The relations (usually owl:SubClassOf) that compose the hierarchy of terms.
    multivalued: true
enums:
  SchemaSlotTypeMenu:
    name: SchemaSlotTypeMenu
    title: Slot Type
    permissible_values:
      slot:
        text: slot
        title: schema slot
        description: A {{slot}} that is stored in the {{schema's}} {{slots}} list.  This specification is available for customizable reuse in any {{class}}.  Note however that if its properties which have values cannot be overriden when reused.
      slot_usage:
        text: slot_usage
        title: class slot
        description: A {{class}} {{slot}} whose name exists in the {{schema's}} {{slots}} list. Because it is linked to the {{schema}} {{slot}} specification, it reuses non-empty {{schema}} {{slot}} property values. It can set its own property values if they are empty in the {{schema}} {{slot}} specification.
      attribute:
        text: attribute
        title: class attribute
        description: A type of {{class}} {{slot}} which is NOT reused from the {{schema}} or from another {{class}}, but rather has control of all its property values.
  SchemaAnnotationTypeMenu:
    name: SchemaAnnotationTypeMenu
    title: Annotation Type
    permissible_values:
      schema:
        text: schema
        title: Schema
      class:
        text: class
        title: Table
      slot:
        text: slot
        title: Schema field
        description: A field (LinkML slot) that is stored in the schema's field (slot) library.  This field specification is available for customizable reuse in any table (LinkML class).  Note however that its attributes which have values cannot be overriden when reused.
      slot_usage:
        text: slot_usage
        title: Table field (from schema)
        description: A table field whose name and source attributes come from a schema library field. It can add its own attributes, but cannot overwrite the schema field ones.  (A LinkML schema slot referenced within a class's slot_usage list of slots.)
      attribute:
        text: attribute
        title: Table field (independent)
        description: A type of {{class}} {{slot}} which is not linked to a {{schema}} {{slots}} {{slot}} and so can manage its own parameter values.
  EnumCriteriaMenu:
    name: EnumCriteriaMenu
    title: Criteria Menu
    permissible_values:
      include:
        text: include
        title: include
      exclude:
        text: exclude
        title: exclude
